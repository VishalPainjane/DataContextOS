[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datacontextos"
version = "0.1.0"
description = "An AI-Native Metadata Intelligence Platform with MCP, Agentic RAG, and Enterprise Observability"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "DataContextOS Contributors" },
]
keywords = ["metadata", "mcp", "rag", "data-governance", "ai-agents", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",

    # AI/ML Core
    "pydantic-ai>=0.1.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # LlamaIndex
    "llama-index-core>=0.12.0",

    # MCP
    "fastmcp>=2.0.0",

    # Evaluation
    "ragas>=0.2.0",
    "deepeval>=1.0.0",

    # Utilities
    "rich>=13.9.0",
    "typer>=0.15.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# Production providers (paid APIs)
prod = [
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "llama-index-vector-stores-postgres>=0.4.0",
    "llama-index-embeddings-openai>=0.3.0",
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "cohere>=5.0.0",
    "langsmith>=0.2.0",
]

# Free-tier providers (zero cost)
free = [
    "sentence-transformers>=3.3.0",
    "chromadb>=0.5.0",
    "llama-index-vector-stores-chroma>=0.4.0",
    "llama-index-embeddings-huggingface>=0.5.0",
    "ollama>=0.4.0",
    "google-genai>=1.0.0",
]

# Observability
observe = [
    "arize-phoenix>=5.0.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

all = [
    "datacontextos[prod,free,observe,dev,test]",
]

[project.scripts]
dcos = "cli:app"

[project.urls]
Homepage = "https://github.com/DataContextOS/datacontextos"
Repository = "https://github.com/DataContextOS/datacontextos"
Documentation = "https://github.com/DataContextOS/datacontextos#readme"

[tool.hatch.build.targets.wheel]
# Source modules live directly at the repo root (flat layout)
packages = [
    "context_layer",
    "database",
    "ingestion",
    "models",
    "providers",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_api: marks tests that require external API keys",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
