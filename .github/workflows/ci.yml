name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatchling uv
        uv pip install -e ".[dev,test]" --system
        
    - name: Lint with Ruff
      run: |
        ruff check .
        
    - name: Type check with mypy
      run: |
        mypy .
        
    - name: Test with pytest
      run: |
        # Run standard unit tests (exclude LLM/API dependent ones)
        pytest tests/ -m "not requires_api" -v
        
    - name: RAG Quality Gates
      env:
        # Requires API keys set in GitHub Secrets
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        # Only run if API keys are available
        if [ -n "$OPENAI_API_KEY" ]; then
          pytest tests/test_rag_quality.py -v
        else
          echo "Skipping RAG quality gates (no API keys)"
        fi
