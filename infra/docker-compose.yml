version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: datacontextos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DCOS_MODE=prod
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/datacontextos
      # Add API keys in .env
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    build: .
    command: fastmcp dev mcp_server/server.py --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - DCOS_MODE=prod
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/datacontextos
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres_data:
